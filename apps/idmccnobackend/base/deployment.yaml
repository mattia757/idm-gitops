apiVersion: apps/v1
kind: Deployment
metadata:
  name: idmccnobackend
  labels:
    app.kubernetes.io/name: idmccnobackend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idmccnobackend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idmccnobackend
    spec:
      containers:
        - name: idmccnobackend
          image: idmccnobackend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: container
            - name: DB_HOST
              value: keycloak-db
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: spesaadomicilio
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: idm-local-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idm-local-db
                  key: password
            - name: KEYCLOAK_BASE_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_REALM
              value: IdmCCNO
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
