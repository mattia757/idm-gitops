apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mattia757/idm-gitops
    targetRevision: main
    path: apps/keycloak/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: idm-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
